<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção</title>

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Roboto',sans-serif;
            background:#fff;
            color:#333;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .container{
            padding:40px;
        }

        .gear{
            font-size:90px;
            animation:spin 5s linear infinite;
            display:inline-block;
            margin-bottom:20px;
        }

        h1{
            font-size:42px;
            margin-bottom:10px;
            color:#222;
        }

        p{
            font-size:20px;
            color:#666;
        }

        @keyframes spin{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="gear">⚙️</div>
    <h1>EM MANUTENÇÃO até 15:00  - Entre em contato pelo WhatsApp (22)99249-7662 - </h1>
    <p>Voltamos em breve.</p>
</div>

</body>
</html>
